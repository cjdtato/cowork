<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="theme-color" content="#f6f7f9">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · Co-Work</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="stylesheet" href="style.css"></head>
<body class="th-white login" style="padding-top:max(14px,env(safe-area-inset-top))">
<script src="auth.js"></script>
<form class="panel card" id="f">
  <div class="head"><svg class="logo big" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="lgl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:.72"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lgl)"/><rect x="12" y="16" width="40" height="36" rx="7" fill="#fff"/><path d="M12 23a7 7 0 0 1 7-7h26a7 7 0 0 1 7 7v3H12z" fill="#000" fill-opacity=".16"/><rect x="21" y="10" width="5" height="12" rx="2.5" fill="#fff"/><rect x="38" y="10" width="5" height="12" rx="2.5" fill="#fff"/><path d="M23 38.5l6.5 6.5L42 32" fill="none" stroke="var(--acc)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h1 class="logo-h"><span class="wm">Co<b>-</b>Work</span></h1><p class="sub"><i>your cowork choice!</i></p></div>
  <input id="u" placeholder="Username" enterkeyhint="next" autocomplete="username" autocapitalize="none" required autofocus>
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
  <div id="err" class="bad" style="font-size:.78rem;font-weight:700;min-height:1.2em"></div>
  <button class="btn pri big" type="submit">Log in</button>
  <div class="foot">Version 1.0.0</div>
</form>
<div class="dotrow" role="group" aria-label="Theme"><button type="button" class="dotb" data-th="white" aria-pressed="false" title="Classic" aria-label="Classic theme"><i class="dotc" style="--a:#6366f1;--b:#f6f7f9"></i></button><button type="button" class="dotb" data-th="dark" aria-pressed="false" title="Dark" aria-label="Dark theme"><i class="dotc" style="--a:#10b981;--b:#0b0f19"></i></button><button type="button" class="dotb" data-th="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight theme"><i class="dotc" style="--a:#818cf8;--b:#0f1020"></i></button><button type="button" class="dotb" data-th="graphite" aria-pressed="false" title="Graphite" aria-label="Graphite theme"><i class="dotc" style="--a:#e5e5e5;--b:#121212"></i></button><button type="button" class="dotb" data-th="ocean" aria-pressed="false" title="Ocean" aria-label="Ocean theme"><i class="dotc" style="--a:#0284c7;--b:#eef6fb"></i></button><button type="button" class="dotb" data-th="forest" aria-pressed="false" title="Forest" aria-label="Forest theme"><i class="dotc" style="--a:#2f855a;--b:#f1f5ee"></i></button><button type="button" class="dotb" data-th="lavender" aria-pressed="false" title="Lavender" aria-label="Lavender theme"><i class="dotc" style="--a:#7c3aed;--b:#f5f3ff"></i></button><button type="button" class="dotb" data-th="sunset" aria-pressed="false" title="Sunset" aria-label="Sunset theme"><i class="dotc" style="--a:#ea580c;--b:#fff7ed"></i></button><button type="button" class="dotb" data-th="sand" aria-pressed="false" title="Sand" aria-label="Sand theme"><i class="dotc" style="--a:#92400e;--b:#f5f1e8"></i></button><button type="button" class="dotb" data-th="pink" aria-pressed="false" title="Pink" aria-label="Pink theme"><i class="dotc" style="--a:#e11d48;--b:#fff1f2"></i></button><button type="button" class="dotb" data-th="cepalco" aria-pressed="false" title="CEPALCO" aria-label="CEPALCO theme"><i class="dotc" style="--a:#000000;--b:#facc15"></i></button></div>
<script>
document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{localStorage.setItem('stb_theme',b.dataset.th);applyTheme(b.dataset.th)});
(async()=>{
  if(await currentUser())return location.replace('index.html');
  const btn=document.querySelector('button'),err=document.getElementById('err');
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();btn.disabled=true;btn.textContent='Logging in…';err.textContent='';
    try{await login(document.getElementById('u').value,document.getElementById('p').value);location.href='index.html'}
    catch(x){err.textContent=x.status?x.message:'Cannot reach the server. Check your connection.';btn.disabled=false;btn.textContent='Log in'}
  };
})();
</script></body></html>
